# YOLO26-RD — road-damage detector: LearnableContrast stem + EdgeSPD + A2C2f + BiFPN,
# P2 features fused but not detected on: Detect(P3, P4, P5). Scale via filename (yolo26s-rd.yaml).

# Novel contributions over stock YOLO26 (and over v7):
#   0. LearnableContrast stem: tile-wise (8x8 grid) per-channel adaptive gamma/gain predicted
#      from local statistics with cross-tile context and bilinear blending — a differentiable,
#      end-to-end learnable CLAHE analogue (local contrast adaptation inside the network).
#   1. EdgeSPD: Sobel-prior edge-gated space-to-depth downsampling at P2->P3 and P3->P4 —
#      lossless downsampling steered toward crack edges (named module, ablatable).
#   2. A2C2f area attention (backbone P4 + head P3): long-range context along elongated cracks.
#   3. P2/4 high-resolution detection head for hairline cracks.
#   4. BiFPN-style backbone skips into the bottom-up fusion path.

# Parameters
nc: 3 # alligator, crack, patching  (set to your dataset's nc)
end2end: True
reg_max: 1
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, LearnableContrast, [3]] # 0  tile-wise adaptive contrast stem (identity at init)
  - [-1, 1, Conv, [64, 3, 2]] # 1-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 2-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 3
  - [-1, 1, EdgeSPD, [256, 3]] # 4-P3/8  edge-gated lossless downsample
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, EdgeSPD, [512, 3]] # 6-P4/16 edge-gated lossless downsample
  - [-1, 2, A2C2f, [512, True, 4]] # 7  area attention: elongated-crack context
  - [-1, 1, Conv, [1024, 3, 2]] # 8-P5/32
  - [-1, 2, C3k2, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 17 (P3/8) area attention at crack scale

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 20 (P2/4-xsmall) hairline cracks

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 17, 5], 1, Concat, [1]] # cat head P3 + backbone P3 (BiFPN-style skip)
  - [-1, 2, C3k2, [256, True]] # 23 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14, 7], 1, Concat, [1]] # cat head P4 + backbone P4 (BiFPN-style skip)
  - [-1, 2, C3k2, [512, True]] # 26 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 29 (P5/32-large)

  - [[23, 26, 29], 1, Detect, [nc]] # Detect(P3, P4, P5) - P2 branch (20) kept as features only
